# Configuration for bayes_optimize_sequential.py
#
# Resume semantics:
#   - n_init is the total Sobol budget across the whole study.
#   - once Sobol initialisation is complete, every fresh invocation of
#     bayes_optimize_sequential.py launches n_bo additional BO iterations and
#     appends new sample folders under results/.
#
# The BO no longer samples directly in the CAD variables t_m, L_s/L_m split,
# delta, or k. Those are derived from interval-safe latent variables so every
# BO point lands inside a mesh-aware admissible box before
# alternating_deflector_cad.py
# sees it.

n_init: 8
n_bo:   20
cores:  4

bo_parameters:
  w_s:
    lower: 0.25
    upper: 0.45
  t_s:
    lower: 0.04
    upper: 0.15
  t_m_ratio:
    lower: 0.0
    upper: 1.0
  L_c:
    lower: 0.40
    upper: 2.40
  L_s_ratio:
    lower: 0.0
    upper: 1.0
  delta_ratio:
    lower: 0.0
    upper: 1.0
  k_ratio:
    lower: 0.0
    upper: 1.0

cad_parameter_bounds:
  t_m:
    lower: 0.025
    upper: 0.15
  L_s:
    lower: 0.80
    upper: 1.80
  L_m:
    lower: 0.80
    upper: 1.80
  delta:
    lower: 0.025
    upper: 0.15

mesh_safety:
  # From FlowCase/system/meshDict:
  #   fine cell size = 1.25e-5 m
  # With H = 1.0e-3 m this is 0.0125 H.
  fine_cell_size_H: 0.0125

  # Dependent-interval margins expressed in fine-cell counts.
  # These are the BO-side "interval arithmetic" guards that keep the sampled
  # CAD away from cfMesh-unresolvable sliver features.
  t_m_min_cells: 2.0
  delta_min_cells: 2.0
  split_gap_min_cells: 4.0
  splitter_step_min_cells: 1.0

  # Meshability-first constraints on the realized deflector-bias profile
  # delta_i = delta + k*xhat_i at the actual cell midpoints.
  delta_mesh_min: 0.04
  delta_span_max: 0.06
  delta_ramp_up_max: 0.05

penalties:
  pdrop: 1000.0
  mix:   1.0
