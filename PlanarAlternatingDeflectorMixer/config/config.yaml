# Base configuration shared by every Snakemake profile.
#
# A profile (profiles/local, profiles/local2, profiles/slurm) selects the
# EXECUTOR and may OVERRIDE any key below through its own `config:` block.  The
# Snakefile itself contains no backend conditionals: switching between the
# laptop, a cluster login node and SLURM compute nodes is a change of
# --workflow-profile and nothing else.
#
#   snakemake --workflow-profile profiles/local  ...
#   snakemake --workflow-profile profiles/slurm  ...

# MPI ranks used by the two solve rules (hydro_simpleFoam,
# mixing_scalar_transport).  SINGLE SOURCE OF TRUTH: the Snakefile writes
# `numberOfSubdomains {np}` into both decomposeParDicts at run time, so the
# committed dictionaries are never read and the launcher and the decomposition
# can never disagree.
np: 2

# MPI launcher.  The `{np}` placeholder is substituted by the Snakefile.
#
# This stays `mpirun` in BOTH profiles because MPI is CONTAINER-INTERNAL:
#
#     sbatch job (host) -> apptainer exec padm.sif -> mpirun -np {np} solver -parallel
#
# so the ranks are never launched by SLURM inside a nested one-task jobstep.
# That nesting is what forces `srun --ntasks={np} --overlap --cpu-bind=none`
# elsewhere, and what silently costs a factor of ~11000 when --cpu-bind=none is
# forgotten.  The hybrid form is still reachable as a one-line profile override
# if a site's mpirun cannot see the jobstep's cpuset:
#
#   mpi_launcher: "srun --ntasks={np} --overlap --cpu-bind=none"
#
# THE DIAGNOSTIC APPLIES EITHER WAY.  OpenFOAM prints ExecutionTime (CPU) and
# ClockTime (wall) every step: wall/CPU ~= 1 means the ranks have their own
# cores, wall/CPU ~= np means they are all sharing one and there will be NO
# error message.  Check it on the first parallel job in any new environment.
mpi_launcher: "mpirun -np {np}"

# Shell preamble prepended to every rule body, run under `set +eu` because
# OpenFOAM's etc/bashrc reads unset variables and would abort under `set -u`.
# Empty by default: inside the Apptainer image OpenFOAM is already configured by
# the image's %environment, and in a native shell the user has sourced it.
env_preamble: ""

# Python interpreter used by the rules that call the study's own scripts.
# Resolved inside the EXECUTION environment, not the caller's -- which is why it
# is a bare name and not a path: inside the image `python3` is /opt/venv/bin/python3.
#
# NOTE ON CONTAINERS.  There is deliberately no `container:` key here and no
# `container:` directive in the Snakefile.  Snakemake never enters the image:
# with profiles/local you are already inside it, and with profiles/slurm the
# per-design job script runs `apptainer exec` before snakemake starts.  See
# CLUSTER.md for why snakemake's own apptainer + SLURM deployment cannot be used
# when the driver itself runs inside the image.
python_bin: "python3"

# -----------------------------------------------------------------------------
# FIDELITY.  Two presets of the same study:
#
#   research  -- the settings the archived campaign (reference/) was computed
#                with: five unit cells, tight tolerances.  Reproduces those
#                numbers.  Measured at np 2 on a laptop: 197-278 s per design.
#   workshop  -- the same mesh resolution, looser tolerances, and a device of
#                two unit cells instead of five.  Measured: 59-82 s per design.
#
# Why these and not a coarser mesh (measured, three baselines):
#   * Loosening the tolerances alone moves the strong design's objectives by
#     +0.02 % (pressure drop) and +0.1 % (mixing index), but saves only ~20 %.
#   * A coarse channel core inflates the mixing index by numerical diffusion
#     at Sc = 1000 (+30 % to +122 %) and reorders the baselines.  Rejected.
#   * A scalar stationarity tolerance of 1e-3 declares convergence long before
#     the outlet field has settled.  Rejected: both presets require 1e-4.
#   * Two cells halve the cell count and keep the ranking of the baselines in
#     both objectives.  Two is the fewest that still alternate.
#
# The two fidelities give different numbers -- the workshop device is shorter --
# and their results must never be pooled: the fidelity is written into every
# design's .workflow/fidelity and as a column of objectives.csv, and the BO
# driver refuses to mix them.  Override per run with  --config fidelity=research
#
#   mesh    cfMesh sizes written into FlowCase/system/meshDict
#   cad     keys overridden in the staged CAD yaml (never in the sample's own)
#   flow    simpleFoam end time, residualControl, solver tolerance, and the
#           arguments of verify_flow_convergence.py
#   scalar  scalarTransportFoam solver tolerance, the chunk end times it may
#           run to, and the stationarity test applied after each chunk
# -----------------------------------------------------------------------------
fidelity: workshop

fidelities:
  research:
    mesh:
      max_cell_size: 4.9999e-5
      wall_cell_size: 1.25e-5
      wall_refinement_thickness: 6.0e-4
    cad: {}
    flow:
      end_time: 2000
      straight_end_time: 600
      residual: 1.0e-5
      solver_tolerance: 1.0e-7
      verify: {window: 100, min_rows: 400, pressure_span_tol: 1.0e-7, residual_tol: 1.0e-5}
    scalar:
      solver_tolerance: 1.0e-8
      chunks: [600, 1200, 1800, 2400]
      verify: {window: 50, min_rows: 200, intensity_tol: 1.0e-4, mean_tol: 1.0e-4}
  workshop:
    mesh:
      max_cell_size: 4.9999e-5
      wall_cell_size: 1.25e-5
      wall_refinement_thickness: 6.0e-4
    cad: {N: 2}
    flow:
      end_time: 1000
      straight_end_time: 600
      residual: 1.0e-4
      solver_tolerance: 1.0e-6
      verify: {window: 50, min_rows: 100, pressure_span_tol: 1.0e-6, residual_tol: 1.0e-4}
    scalar:
      solver_tolerance: 1.0e-6
      chunks: [200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400]
      verify: {window: 50, min_rows: 200, intensity_tol: 1.0e-4, mean_tol: 1.0e-4}
